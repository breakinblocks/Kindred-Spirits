plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version "${mdg_version}"
}

def isSnapshot = System.getenv('SNAPSHOT') == 'true'
version = "${minecraft_version}-${mod_version}${isSnapshot ? '-SNAPSHOT' : ''}"
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

sourceSets {
    test {
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += main.output + main.runtimeClasspath
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

repositories {
    mavenCentral()
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

neoForge {
    version = neoforge_version

    interfaceInjectionData.from provider {
        zipTree(configurations.geckolibInterfaces.singleFile)
                .matching { include 'META-INF/interface_injections.json' }
    }

    runs {
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }

        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            gameDirectory = project.file('run-gametest')
            programArguments.addAll '--tests', 'kindredspirits:*', '--report', 'results.xml'
        }

        clientData {
            clientData()
            programArguments.addAll '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.test
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    geckolibInterfaces
}

dependencies {
    geckolibInterfaces "maven.modrinth:geckolib:${geckolib_version}"

    compileOnly "io.github.llamalad7:mixinextras-common:${mixinextras_version}"
    annotationProcessor "io.github.llamalad7:mixinextras-common:${mixinextras_version}"

    implementation "maven.modrinth:geckolib:${geckolib_version}"

    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    compileOnly "maven.modrinth:jade:${jade_version}"
    localRuntime "maven.modrinth:jade:${jade_version}"

    compileOnly "maven.modrinth:oracle-index:${oracle_index_version}"
    localRuntime "maven.modrinth:oracle-index:${oracle_index_version}"
    localRuntime "maven.modrinth:architectury-api:${architectury_version}"
}

tasks.named('test', Test).configure {
    failOnNoDiscoveredTests = false
}

tasks.register('verifyItemArt') {
    group = 'verification'
    description = 'Checks native 16x16 item PNGs.'
    def textures = fileTree('src/main/resources/assets/kindredspirits/textures/item') { include '*.png' }
    inputs.files(textures)
    doLast {
        textures.each { texture ->
            def image = javax.imageio.ImageIO.read(texture)
            if (image == null || image.width != 16 || image.height != 16) {
                throw new GradleException("${texture.name}: expected a 16x16 PNG")
            }
            int opaque = 0
            for (int y = 0; y < 16; y++) {
                for (int x = 0; x < 16; x++) {
                    int alpha = (image.getRGB(x, y) >>> 24) & 255
                    if (alpha != 0 && alpha != 255) throw new GradleException("${texture.name}: partial alpha at ${x},${y}")
                    if (alpha == 255) opaque++
                }
            }
            if (opaque == 0 || opaque == 256) throw new GradleException("${texture.name}: expected a transparent silhouette")
        }
        logger.lifecycle("Verified ${textures.files.size()} native 16x16 item textures")
    }
}

tasks.named('check').configure { dependsOn 'verifyItemArt' }

tasks.register('verifyModResources') {
    group = 'verification'
    description = 'Checks JSON syntax, local item model links, and animation bone references.'
    def resourceRoot = file('src/main/resources')
    inputs.dir(resourceRoot)
    doLast {
        def json = new groovy.json.JsonSlurper()
        def assets = new File(resourceRoot, 'assets/kindredspirits')
        fileTree(resourceRoot) { include '**/*.json' }.each { json.parse(it) }
        fileTree(new File(assets, 'items')) { include '*.json' }.each { item ->
            def model = json.parse(item).model.model
            if (model?.startsWith('kindredspirits:') && !new File(assets, "models/${model.split(':')[1]}.json").isFile()) {
                throw new GradleException("${item.name}: missing local item model ${model}")
            }
        }
        fileTree(new File(assets, 'models')) { include '**/*.json' }.each { model ->
            def document = json.parse(model)
            document.textures?.values()?.each { texture ->
                if (texture.startsWith('kindredspirits:') && !new File(assets, "textures/${texture.split(':')[1]}.png").isFile()) {
                    throw new GradleException("${model.name}: missing texture ${texture}")
                }
            }
        }
        fileTree(new File(assets, 'geckolib/models/entity')) { include '*.json' }.each { model ->
            def geometry = json.parse(model).'minecraft:geometry'[0]
            def names = geometry.bones.collect { it.name } as Set
            geometry.bones.each { bone ->
                if (bone.parent && !names.contains(bone.parent)) throw new GradleException("${model.name}: missing parent ${bone.parent}")
            }
            def species = model.name.replace('.geo.json', '').replace('_slim', '')
            def animationFile = new File(assets, "geckolib/animations/entity/${species}.animation.json")
            if (!animationFile.isFile()) throw new GradleException("${model.name}: missing animation file")
            json.parse(animationFile).animations.each { name, animation ->
                animation.bones?.keySet()?.each { bone ->
                    if (!names.contains(bone)) throw new GradleException("${animationFile.name}/${name}: missing model bone ${bone}")
                }
            }
        }
        logger.lifecycle('Verified resource JSON, item model links, textures, and animation bones')
    }
}

tasks.named('check').configure { dependsOn 'verifyModResources' }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neoforge_version       : neoforge_version,
            neoforge_version_range : neoforge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_credits            : mod_credits,
            mod_description        : mod_description
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }

    from("$rootDir/wiki") {
        into "assets/oracle_index/books/${mod_id}"
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.register('publishMaven') {
    description = 'Publishes the mod JAR and sources JAR to the BreakInBlocks Maven repository.'
    group = 'publishing'
    dependsOn 'publishMavenJavaPublicationToBreakInBlocksRepository'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = 'kindredspirits'
            from components.java
        }
    }
    repositories {
        maven {
            name = 'BreakInBlocks'
            url = isSnapshot
                    ? 'https://maven.breakinblocks.com/snapshots'
                    : 'https://maven.breakinblocks.com/releases'
            credentials {
                username = System.getenv('MAVEN_USER') ?: ''
                password = System.getenv('MAVEN_TOKEN') ?: ''
            }
        }
    }
}
