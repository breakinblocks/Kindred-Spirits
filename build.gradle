plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version "${mdg_version}"
    id 'com.diffplug.spotless' version '8.10.3'
}

def hasSnapshotVersion = mod_version ==~ /.*-SNAPSHOT(?:\.\d+)?/
def isSnapshot = hasSnapshotVersion || System.getenv('SNAPSHOT') == 'true'
def modArtifactVersion = "${mod_version}${isSnapshot && !hasSnapshotVersion ? '-SNAPSHOT' : ''}"
version = "${minecraft_version}-${modArtifactVersion}"
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

sourceSets {
    test {
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += main.output + main.runtimeClasspath
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

repositories {
    mavenCentral()
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'Illusive Soulworks'
        url = 'https://maven.theillusivec4.top/'
        content { includeGroup 'top.theillusivec4.curios' }
    }
}

neoForge {
    version = neoforge_version

    interfaceInjectionData.from provider {
        zipTree(configurations.geckolibInterfaces.singleFile)
                .matching { include 'META-INF/interface_injections.json' }
    }

    runs {
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }

        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            gameDirectory = project.file('run-gametest')
            programArguments.addAll '--tests', 'kindredspirits:*', '--report', 'results.xml'
        }

        clientData {
            clientData()
            programArguments.addAll '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.test
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    geckolibInterfaces
}

dependencies {
    geckolibInterfaces "maven.modrinth:geckolib:${geckolib_version}"

    compileOnly "io.github.llamalad7:mixinextras-common:${mixinextras_version}"
    annotationProcessor "io.github.llamalad7:mixinextras-common:${mixinextras_version}"

    implementation "maven.modrinth:geckolib:${geckolib_version}"

    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    compileOnly "maven.modrinth:jade:${jade_version}"
    localRuntime "maven.modrinth:jade:${jade_version}"

    compileOnly "maven.modrinth:oracle-index:${oracle_index_version}"
    localRuntime "maven.modrinth:oracle-index:${oracle_index_version}"
    localRuntime "maven.modrinth:architectury-api:${architectury_version}"

    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    localRuntime "top.theillusivec4.curios:curios-neoforge:${curios_version}"
}

tasks.named('test', Test).configure {
    failOnNoDiscoveredTests = false
}

tasks.register('verifyItemArt') {
    group = 'verification'
    description = 'Checks native 16x16 item PNGs.'
    def textures = fileTree('src/main/resources/assets/kindredspirits/textures/item') { include '*.png' }
    inputs.files(textures)
    doLast {
        textures.each { texture ->
            def image = javax.imageio.ImageIO.read(texture)
            if (image == null || image.width != 16 || image.height != 16) {
                throw new GradleException("${texture.name}: expected a 16x16 PNG")
            }
            int opaque = 0
            for (int y = 0; y < 16; y++) {
                for (int x = 0; x < 16; x++) {
                    int alpha = (image.getRGB(x, y) >>> 24) & 255
                    if (alpha != 0 && alpha != 255) throw new GradleException("${texture.name}: partial alpha at ${x},${y}")
                    if (alpha == 255) opaque++
                }
            }
            if (opaque == 0 || opaque == 256) throw new GradleException("${texture.name}: expected a transparent silhouette")
        }
        logger.lifecycle("Verified ${textures.files.size()} native 16x16 item textures")
    }
}

tasks.named('check').configure { dependsOn 'verifyItemArt' }

tasks.register('verifyModResources') {
    group = 'verification'
    description = 'Checks JSON syntax, local item model links, and animation bone references.'
    def resourceRoot = file('src/main/resources')
    inputs.dir(resourceRoot)
    doLast {
        def json = new groovy.json.JsonSlurper()
        def assets = new File(resourceRoot, 'assets/kindredspirits')
        fileTree(resourceRoot) { include '**/*.json' }.each { json.parse(it) }
        fileTree(new File(assets, 'items')) { include '*.json' }.each { item ->
            def model = json.parse(item).model.model
            if (model?.startsWith('kindredspirits:') && !new File(assets, "models/${model.split(':')[1]}.json").isFile()) {
                throw new GradleException("${item.name}: missing local item model ${model}")
            }
        }
        fileTree(new File(assets, 'models')) { include '**/*.json' }.each { model ->
            def document = json.parse(model)
            document.textures?.values()?.each { texture ->
                if (texture.startsWith('kindredspirits:') && !new File(assets, "textures/${texture.split(':')[1]}.png").isFile()) {
                    throw new GradleException("${model.name}: missing texture ${texture}")
                }
            }
        }
        fileTree(new File(assets, 'geckolib/models/entity')) { include '*.json' }.each { model ->
            def geometry = json.parse(model).'minecraft:geometry'[0]
            def names = geometry.bones.collect { it.name } as Set
            geometry.bones.each { bone ->
                if (bone.parent && !names.contains(bone.parent)) throw new GradleException("${model.name}: missing parent ${bone.parent}")
            }
            def species = model.name.replace('.geo.json', '').replace('_slim', '')
            def animationFile = new File(assets, "geckolib/animations/entity/${species}.animation.json")
            if (!animationFile.isFile()) throw new GradleException("${model.name}: missing animation file")
            json.parse(animationFile).animations.each { name, animation ->
                animation.bones?.keySet()?.each { bone ->
                    if (!names.contains(bone)) throw new GradleException("${animationFile.name}/${name}: missing model bone ${bone}")
                }
            }
        }
        logger.lifecycle('Verified resource JSON, item model links, textures, and animation bones')
    }
}

tasks.named('check').configure { dependsOn 'verifyModResources' }

tasks.register('verifyParticleArt') {
    group = 'verification'
    description = 'Validates particle registration and animation frames.'
    inputs.dir('src/main/resources/assets/kindredspirits/particles')
    inputs.dir('src/main/resources/assets/kindredspirits/textures/particle')
    inputs.file('src/main/java/com/breakinblocks/kindredspirits/registry/KindredParticles.java')
    doLast {
        def json = new groovy.json.JsonSlurper()
        def assets = file('src/main/resources/assets/kindredspirits')
        def registry = file('src/main/java/com/breakinblocks/kindredspirits/registry/KindredParticles.java').text
        def registered = (registry =~ /register\("([a-z_]+)"/).collect { it[1] } as Set
        def descriptions = fileTree(new File(assets, 'particles')) { include '*.json' }
        def manifest = descriptions.collect {
            [name: it.name.replace('.json', ''), frames: json.parse(it).textures.size()]
        }
        def names = manifest.collect { it.name } as Set
        if (registered != names || names.size() != manifest.size()) throw new GradleException('Particle descriptions and registrations differ')
        def expectedTextures = [] as Set
        int frames = 0
        manifest.each { entry ->
            if (entry.frames < 1) throw new GradleException("${entry.name}: empty animation")
            def textures = json.parse(new File(assets, "particles/${entry.name}.json")).textures
            def expected = (0..<entry.frames).collect { "kindredspirits:${entry.name}_${it}".toString() }
            if (textures != expected) throw new GradleException("${entry.name}: frames must be in order")
            def distinct = [] as Set
            textures.each { id ->
                def texture = new File(assets, "textures/particle/${id.split(':')[1]}.png")
                expectedTextures.add(texture.name)
                if (!texture.isFile()) throw new GradleException("Missing particle frame: ${id}")
                def image = javax.imageio.ImageIO.read(texture)
                if (image == null || image.width != 16 || image.height != 16) throw new GradleException("${id}: expected 16x16 PNG")
                def pixels = []
                int opaque = 0
                for (int y = 0; y < 16; y++) for (int x = 0; x < 16; x++) {
                    int pixel = image.getRGB(x, y)
                    int alpha = (pixel >>> 24) & 255
                    if (alpha != 0 && alpha != 255) throw new GradleException("${id}: partial-alpha pixel")
                    if (alpha == 255) opaque++
                    pixels.add(pixel)
                }
                if (opaque == 0 || opaque == 256) throw new GradleException("${id}: expected a transparent silhouette")
                distinct.add(pixels)
                frames++
            }
            if (entry.frames > 1 && distinct.size() < 2) throw new GradleException("${entry.name}: animation has no visible changes")
        }
        def actual = fileTree(new File(assets, 'textures/particle')) { include '*.png' }.collect { it.name } as Set
        if (actual != expectedTextures) throw new GradleException('Unreferenced or missing particle frames')
        logger.lifecycle("Verified ${manifest.size()} animated particles and ${frames} native 16x16 frames")
    }
}

tasks.named('check').configure { dependsOn 'verifyParticleArt' }

tasks.register('verifySoundAssets') {
    group = 'verification'
    description = 'Validates custom sound registrations, subtitles and mono Vorbis assets.'
    inputs.dir('src/main/resources/assets/kindredspirits/sounds')
    inputs.file('src/main/resources/assets/kindredspirits/sounds.json')
    inputs.file('src/main/resources/assets/kindredspirits/lang/en_us.json')
    inputs.file('src/main/java/com/breakinblocks/kindredspirits/registry/KindredSounds.java')
    doLast {
        def json = new groovy.json.JsonSlurper()
        def assets = file('src/main/resources/assets/kindredspirits')
        def sounds = json.parse(new File(assets, 'sounds.json'))
        def lang = json.parse(new File(assets, 'lang/en_us.json'))
        def registry = file('src/main/java/com/breakinblocks/kindredspirits/registry/KindredSounds.java').text
        def registered = (registry =~ /register\("([a-z_.]+)"/).collect { it[1] } as Set
        if (registered != sounds.keySet()) throw new GradleException('Sound registrations and sounds.json differ')
        def referenced = [] as Set
        sounds.each { event, definition ->
            if (!lang[definition.subtitle]) throw new GradleException("${event}: missing subtitle")
            if (!definition.sounds) throw new GradleException("${event}: empty sound list")
            definition.sounds.each { entry ->
                def name = entry instanceof String ? entry : entry.name
                if (name.startsWith('minecraft:')) return
                if (!name.startsWith('kindredspirits:')) throw new GradleException("${event}: unknown sound namespace in ${name}")
                def path = name.substring('kindredspirits:'.length()) + '.ogg'
                referenced.add(path)
                def soundFile = new File(assets, "sounds/${path}")
                if (!soundFile.isFile()) throw new GradleException("${event}: missing ${path}")
                byte[] bytes = soundFile.bytes
                if (bytes.length < 60 || new String(bytes, 0, 4, 'US-ASCII') != 'OggS')
                    throw new GradleException("${path}: not an OGG stream")
                int packet = 27 + (bytes[26] & 255)
                if (bytes.length < packet + 30 || bytes[packet] != 1
                        || new String(bytes, packet + 1, 6, 'US-ASCII') != 'vorbis')
                    throw new GradleException("${path}: not Vorbis audio")
                if (path != 'yeet.ogg') {
                    int sampleRate = java.nio.ByteBuffer.wrap(bytes, packet + 12, 4)
                            .order(java.nio.ByteOrder.LITTLE_ENDIAN).getInt()
                    if ((bytes[packet + 11] & 255) != 1 || sampleRate != 44100)
                        throw new GradleException("${path}: expected mono 44.1 kHz audio")
                }
            }
        }
        def actual = fileTree(new File(assets, 'sounds')) { include '**/*.ogg' }.files.collect {
            new File(assets, 'sounds').toPath().relativize(it.toPath()).toString().replace('\\', '/')
        } as Set
        if (actual != referenced) throw new GradleException('Unreferenced sound assets')
        logger.lifecycle("Verified ${sounds.size()} custom sound events, subtitles and OGG assets")
    }
}

tasks.named('check').configure { dependsOn 'verifySoundAssets' }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neoforge_version       : neoforge_version,
            neoforge_version_range : neoforge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : modArtifactVersion,
            mod_authors            : mod_authors,
            mod_credits            : mod_credits,
            mod_description        : mod_description
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }

    from("$rootDir/wiki") {
        into "assets/oracle_index/books/${mod_id}"
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.register('publishMaven') {
    description = 'Publishes the mod JAR and sources JAR to the BreakInBlocks Maven repository.'
    group = 'publishing'
    dependsOn 'publishMavenJavaPublicationToBreakInBlocksRepository'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = 'kindredspirits'
            from components.java
        }
    }
    repositories {
        maven {
            name = 'BreakInBlocks'
            url = isSnapshot
                    ? 'https://maven.breakinblocks.com/snapshots'
                    : 'https://maven.breakinblocks.com/releases'
            credentials {
                username = System.getenv('MAVEN_USER') ?: ''
                password = System.getenv('MAVEN_TOKEN') ?: ''
            }
        }
    }
}

spotless {
    java {
        target 'src/*/java/**/*.java'
        palantirJavaFormat()
        importOrder()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}
